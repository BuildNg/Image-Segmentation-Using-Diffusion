[LabelEncoder]
; Number of input channels (1 for single-channel binary mask)
InChannels = 1
; Filter multipliers per stage (comma-separated)
; Length determines number of stages; pooling between each pair
EncoderLayers = 1, 2, 4, 4, 2
; Base filter count; each stage uses EncoderLayers[i] * FilterNum channels
FilterNum = 16
; Convolution kernel size
FilterSize = 3
; Dropout rate (0 to disable)
Dropout = 0
; Use batch normalisation [choices -> True, False]
UseBatchNorm = True
; Activation function [choices -> swish, relu, gelu]
Activation = relu

[LabelDecoder]
; Number of input channels (matches encoder output, typically 1)
InChannels = 1
; Filter multipliers per upsample stage (comma-separated)
; Length = number of upsample ops (should match encoder pool count)
DecoderLayers = 2, 4, 4, 2
; Base filter count
FilterNum = 16
; Convolution kernel size
FilterSize = 3
; Dropout rate
Dropout = 0
; Use batch normalisation [choices -> True, False]
UseBatchNorm = True
; Number of output segmentation classes
NumClasses = 2
; Activation function [choices -> swish, relu, gelu]
Activation = relu

[ImageEncoder]
; Number of input image channels (4 for LIDC: grayscale repeated 4×)
InChannels = 4
; Base filter count
FilterSize = 16
; Convolution kernel size
KernelSize = 3
; Dropout rate
Dropout = 0
; GroupNorm groups for ConvBlock and attention
Groups = 4
; Output embedding channels (1 to match latent space)
OutChannels = 1
; Filter multipliers for main ConvBlock stages (comma-separated)
BlockMults = 2, 4, 4, 2
; Which ConvBlock indices (0-indexed) get a MultiHeadAttention after them
AttentionAfter = 2, 3
; Activation function [choices -> swish, relu, gelu]
Activation = relu

[Denoiser]
; Latent input channels (1 for default LDSeg)
LatentChannels = 1
; Conditioning embedding channels from image encoder
CondChannels = 1
; Channels after initial conv on concatenated latent + cond
FirstConvChannels = 16
; Channel widths for each U-Net resolution level (comma-separated)
Widths = 16, 32, 64
; Whether to add attention at each level (comma-separated) [choices -> True, False per entry]
HasAttention = False, True, True
; Number of residual blocks per level in the down path
NumResBlocks = 2
; Groups for GroupNorm
NormGroups = 4
; Interpolation mode for upsampling [choices -> nearest, bilinear]
Interpolation = nearest
; Activation function [choices -> swish, relu, gelu]
Activation = relu

[Distribution]
; AxisAlignedConvGaussian (prior & posterior share the same architecture)
; Input channels (1 for the grayscale patch from x_start[:, 0:1])
InputChannels = 1
; Filter widths per encoder block (comma-separated)
NumFilters = 32, 64, 128, 192
; Convolutions per block
NoConvsPerBlock = 3
; Latent dimension for mu/sigma vectors
LatentDim = 6

[NoiseScheduler]
; Training noise schedule parameters
; Scheduler type [choices -> linear, cosine]
Scheduler = cosine
; Total number of diffusion time steps
Timesteps = 1000
; Beta range for linear schedule (ignored if cosine)
Beta_0 = 1e-4
Beta_T = 0.02
