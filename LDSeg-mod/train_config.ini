[Data]
; Path to the dataset root directory
DatasetDir = ../data/training
; Path to the validation dataset root directory
ValidationDir = ../data/validation
; Image size (H, W)
ImageSize = 128
; Number of workers for dataloader
NumWorkers = 20

[Augmentation]
; Enable data augmentation during training [True, False]
Enable = True
; Probability of applying augmentation to a sample (0.0 to 1.0)
Probability = 0.2

; === Geometric Transformations ===
; Rotation: max random rotation in degrees (0 to disable)
RotationDegrees = 10
; Translation: max random shift as fraction of image size (0.0 to disable)
TranslationFraction = 0.1
; Scaling: random scale range (1.0, 1.0 to disable)
ScaleMin = 1.0
ScaleMax = 1.0
; Horizontal flip [True, False]
HorizontalFlip = True
; Vertical flip [True, False]
VerticalFlip = True
; Elastic deformation [True, False] - expensive, use with care
ElasticDeformation = False
; Elastic alpha (displacement magnitude) and sigma (smoothness)
ElasticAlpha = 50
ElasticSigma = 5

; === Intensity Transformations (applied to image only, not labels) ===
; Brightness shift range (0.0 to disable, e.g. 0.1 means +/-10%)
BrightnessRange = 0.0
; Contrast adjustment range (0.0 to disable, e.g. 0.2 means +/-20%)
ContrastRange = 0.0
; Gamma correction range (1.0, 1.0 to disable, e.g. 0.8, 1.2)
GammaMin = 1.0
GammaMax = 1.0
; Gaussian noise std (0.0 to disable)
GaussianNoiseStd = 0.0
; Gaussian blur sigma max (0.0 to disable)
GaussianBlurSigma = 0.0

[Device]
; Device to use for training [cpu, cuda, cuda:0, etc.]
Device = cuda

[Training]
; Number of epochs
Epochs = 100
; Batch size
BatchSize = 24
; Mixed precision training [True, False]
MixedPrecision = False
; Gradient clipping max norm (0 to disable)
GradClipNorm = 1.0
; Random seed
Seed = 42

[Optimizer]
; UNet Learning Rate and Weight Decay
UNetLR = 0.0001
UNetWeightDecay = 0

; VAE Learning Rate and Weight Decay
VaeLR = 0.00003
VaeWeightDecay = 0.0001

; Cond Encoder Learning Rate and Weight Decay
CondLR = 0.00005
CondWeightDecay = 0.0001
; Learning rate scheduler [constant, linear, cosine]
LRScheduler = cosine
; Warmup epochs (for linear/cosine)
WarmupEpochs = 5

[Losses]
; Weight for Diffusion MSE loss (Lambda in original paper?)
Lambda_Diffusion = 1.0
; Weight for VLB Loss within the Diffusion MSE
Lambda_VLB = 0.001
; Weight for KL Divergence loss
Lambda_KL = 0.0001
; Weight for Label Encoder VAE KL divergence loss
Lambda_VAE_KL = 0.00001
; Penalize Recon loss more
; Weight for Dice loss component in reconstruction (Gamma)
Gamma_Dice = 1.0
; Weight for CE loss component in reconstruction
Lambda_CE = 1.0
[EMA]
; Exponential Moving Average for UNet parameters
Enable = True
Decay = 0.9999

[Logging]
; Save checkpoint every N epochs
SaveInterval = 5
; Directory to save checkpoints and logs
LogDir = ./training_logs
; Resume from checkpoint [path or empty]
ResumeCheckpoint = 

[EarlyStopping]
; Enable early stopping [True, False]
Enable = True
; Monitor metric [loss, val_loss]
Monitor = val_loss
; Patience (epochs)
Patience = 30
; Minimum change to qualify as improvement
MinDelta = 0.0001
